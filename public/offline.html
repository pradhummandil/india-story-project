<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Offline — India Story Project</title>
    <style>
      body {
        background-color: #0c0c0c;
        color: #ffffff;
        font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
        display: flex;
        align-items: center;
        justify-content: center;
        min-height: 100vh;
        margin: 0;
        text-align: center;
        padding: 20px;
      }
      h1 {
        font-size: 2rem;
        margin-bottom: 10px;
        color: #c8a96a;
      }
      p {
        color: #a0a0a0;
        font-size: 0.9rem;
        max-width: 320px;
        margin: 0 auto 20px;
      }
      button {
        background-color: #8b0000;
        color: white;
        border: none;
        padding: 10px 20px;
        font-size: 0.8rem;
        text-transform: uppercase;
        letter-spacing: 0.1em;
        font-weight: bold;
        cursor: pointer;
      }
    </style>
  </head>
  <body>
    <div>
      <h1>Connection Lost</h1>
      <p>You are currently offline. Check your internet connection and try reloading the page.</p>
      <button onclick="window.location.reload()">Retry Connection</button>
    </div>
  </body>
</html>
